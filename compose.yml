services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: banker
      POSTGRES_USER: banker
      POSTGRES_PASSWORD: ${BANKER_DB_PASSWORD:-banker-local-demo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - banker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banker -d banker"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  banker-data:
