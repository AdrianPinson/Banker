name: Banker workspace
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: banker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -Pweb clean verify
      - run: npm --prefix frontend test
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banker-browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: banker-desktop-web
          path: target/banker-*.jar
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: banker_test
          POSTGRES_USER: banker
          POSTGRES_PASSWORD: banker-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U banker -d banker_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BANKER_TEST_DB_URL: jdbc:postgresql://localhost:5432/banker_test
      BANKER_TEST_DB_USER: banker
      BANKER_TEST_DB_PASSWORD: banker-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean verify
